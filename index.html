
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый Релиз / Apexevolute</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .cover {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
        }
        h2 {
            font-size: 16px;
            color: #b3b3b3;
            font-weight: normal;
            margin: 0 0 30px 0;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .yandex:hover { background: #ffcc00; color: #000; border-color: #ffcc00; }
        .spotify:hover { background: #1ED760; color: #000; border-color: #1ED760; }
        .apple:hover { background: #fc3c44; border-color: #fc3c44; }
        .vk:hover { background: #0077FF; border-color: #0077FF; }
    </style>
</head>
<body>

<div class="container">
    <!-- Временная обложка. Позже замените на свою ссылку из Яндекс.Музыки или VK -->
    <img src="https://unsplash.com" alt="Обложка релиза" class="cover">

    <!-- Заголовки (можете изменить Блокнотом прямо сейчас или потом) -->
    <h1>Название трека или альбома</h1>
    <h2>Apexevolute</h2>

    <!-- Кнопки-ссылки. Пока стоят временные знаки #, чтобы сайт работал без ошибок -->
    <a href="#" target="_blank" class="link-btn yandex">Яндекс Музыка</a>
    <a href="#" target="_blank" class="link-btn vk">VK Музыка</a>
    <a href="#" target="_blank" class="link-btn spotify">Spotify</a>
    <a href="#" target="_blank" class="link-btn apple">Apple Music</a>
    <a href="#" target="_blank" class="link-btn">Звук</a>
</div>

</body>
</html>
